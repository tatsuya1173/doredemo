version: '3.8'
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
      - rails
      - node
      - java
      - python

  laravel:
    build: ./laravel-app
    volumes:
      - ./laravel-app:/var/www/html
    expose:
      - 80
    command: >
      bash -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
              chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
              apache2-foreground"

  rails:
    build: ./rails-app
    expose:
      - 3000
    depends_on:
      - mysql

  node:
    build: ./node-app
    expose:
      - 3001

  java:
    build: ./java-app
    dns:
      - 8.8.8.8
    expose:
      - 8080

  python:
    build: ./python-app
    expose:
      - 5000
      
  mysql:
    image: mysql:8.0
    container_name: shared-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: appuser
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
