# MySQL. Versions 5.5.8 and up are supported.
#
# Install the MySQL driver
#   gem install mysql2
#
# Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"
#
# And be sure to use new-style password hashing:
#   https://dev.mysql.com/doc/refman/5.7/en/password-hashing.html
#
default: &default
  adapter: mysql2
  encoding: utf8
  host: mysql             # ← ここ重要（サービス名）
  username: appuser       # ← docker-compose.ymlと一致
  password: secret        # ← 同上
  database: app           # ← 同上
  port: 3306
  pool: 5

development:
  <<: *default

test:
  <<: *default
  database: app_test

production:
  adapter: mysql2
  encoding: utf8
  reconnect: false
  database: rails_db
  pool: 5
  username: appuser
  password: secret
  host: mysql
